# AccessBridge AI — Docker Compose stack
# Backend (8000) + Frontend (5173) + three uAgent processes (8001-8003).

version: "3.9"

services:
  backend:
    build:
      context: .
      target: backend
    container_name: accessbridge-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  research-agent:
    build:
      context: .
      target: backend
    container_name: accessbridge-research-agent
    command: ["python", "-m", "agents.research_agent"]
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - backend

  language-agent:
    build:
      context: .
      target: backend
    container_name: accessbridge-language-agent
    command: ["python", "-m", "agents.language_agent"]
    env_file:
      - .env
    ports:
      - "8002:8002"
    depends_on:
      - backend

  guidance-agent:
    build:
      context: .
      target: backend
    container_name: accessbridge-guidance-agent
    command: ["python", "-m", "agents.guidance_agent"]
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      - backend

  frontend:
    build:
      context: .
      target: frontend
    container_name: accessbridge-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
